services:
  # Backend API Web Service (Docker with Headless LibreOffice)
  - type: web
    name: convertx-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MAX_FILE_SIZE_MB
        value: 25
      - key: FILE_RETENTION_MINUTES
        value: 30
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: convertx-client
          property: host

  # Frontend Static Site
  - type: web
    name: convertx-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: convertx-server
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
